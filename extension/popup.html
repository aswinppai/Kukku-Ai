<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kukko AI Companion</title>
    <style>
        body {
            width: 260px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 16px;
            margin: 0;
            background: #0f172a;
            color: #f8fafc;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .avatar {
            font-size: 32px;
        }
        h2 {
            margin: 0;
            font-size: 16px;
            color: #38bdf8;
        }
        .status-box {
            background: #1e293b;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
            margin-right: 6px;
            transition: background 0.2s;
        }
        .status-indicator.online {
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.7);
        }
        .status-indicator.offline {
            background: #ef4444;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.7);
        }
        button {
            width: 100%;
            padding: 10px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="avatar">🦜</div>
        <div>
            <h2>Kukko AI Companion</h2>
            <small style="color:#94a3b8">Browser-Aware AI</small>
        </div>
    </div>
    <div class="status-box">
        <span class="status-indicator"></span>
        <span id="backend-status">Checking backend...</span>
    </div>
    <button id="check-btn">Test Proactive Reaction</button>
    <script src="popup.js"></script>
</body>
</html>
